    - {kind: balance_decrease_over, account: acc_priya_aud, over_minor: 5000}
  notes: "The changed payee is a new proposal with its own hash, its own card and the first payment cap; a confirmation for the first card cannot carry over (INV-5)."

- id: RT-092
