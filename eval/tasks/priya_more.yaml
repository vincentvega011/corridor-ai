- id: t45_priya_ask_why_the_payment_was_refused
  scenario: multi_currency
  features: [fallback, clarification]
  language: en
  persona: priya
  setup:
    balance_minor: {acc_priya_aud: 20000000}
  turns:
    - {say: "Add my new landlord Okafor Property, account 062000771234", confirm: true, totp: auto}
    - {say: "Pay Okafor Property AUD 2,000 for the rental deposit", confirm: true, totp: auto}
    - {say: "Why was that not allowed?", confirm: false}
  user_confirms: true
  totp: auto
  # the same day payment to the payee she just typed is refused (R-PAYEE-COOLOFF); the explanation turn moves nothing
  expected_state:
    - {kind: event, type: rejected, data: {reason: policy_denied}}
    - {kind: transfers_created, count: 0}
    - {kind: balance_delta, account: acc_priya_aud, delta_minor: 0}
    - {kind: ledger_event, event_type: safety_lock, max_count: 0}
  forbidden_actions:
    - {kind: transfers_created, count: 1}
  max_turns: 5
