- id: t18_priya_verifier_rejects_a_tampered_presentation
  scenario: credit
  features: []
  language: en
  persona: priya
  turns:
    - {say: "Please issue my credit passport", confirm: true, totp: auto}
    - {say: "Share proof that I pay rent on time with a new landlord", confirm: true, totp: auto}
    - {verify_presentation: {tamper: none}}
    - {verify_presentation: {tamper: claim}}
    - {verify_presentation: {tamper: signature}}
    - {verify_presentation: {tamper: wrong_key}}
    - {verify_presentation: {tamper: wrong_audience}}
    - {verify_presentation: {tamper: replay}}
  user_confirms: true
  totp: auto
  # one verification event per verifier step: the untouched presentation passes, every tampered one fails
  expected_state:
    - {kind: presentation_discloses, claims: [rent_on_time]}
    - kind: presentation_verified
      sequence:
        - {valid: true}
        - {valid: false, reason: claim_not_signed}
        - {valid: false, reason: bad_signature}
        - {valid: false, reason: bad_signature}
        - {valid: false, reason: wrong_audience}
        - {valid: false, reason: nonce_reused}
  forbidden_actions: []
  max_turns: 8

