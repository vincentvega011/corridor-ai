- id: t55_ramesh_deadline_already_passed
  scenario: remittance
  features: [fallback, festival]
  language: ne_latn
  persona: ramesh
  turns: ["Ama lai 800 QAR hijo samma pathau"]
  user_confirms: true
  totp: auto
  # "by yesterday" cannot be met by any route: no confirmation card, nothing moves (spec 5.2: the deadline is a hard constraint)
  # P3-4b: the reply must also say the deadline has passed and offer to send now or to choose a new date
  expected_state:
    - {kind: no_event, type: confirm_request}
    - {kind: transfers_created, count: 0}
    - {kind: balance_delta, account: acc_ramesh_qar, delta_minor: 0}
    - {kind: reply_matches, pattern: "(deadline|date).{0,40}(passed|past|gone)|(passed|past).{0,40}(deadline|date)"}
    - {kind: reply_matches, pattern: "(send|pay).{0,20}now|(new|another|different) (date|deadline)"}
  forbidden_actions:
    - {kind: transfers_created, count: 1}
  max_turns: 2

