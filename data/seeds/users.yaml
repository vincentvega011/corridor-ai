# Three synthetic personas (docs/spec/product.md section 1). Everything here is fictional: ALL names, accounts and
# amounts are synthetic (the apps show a "synthetic" badge on seeded payees; display names carry no suffix).
synthetic: true
# Money is integer minor units. Account numbers are never written here: they are derived
# deterministically by corridor.sandbox.synth from the keys below and stored only as an HMAC
# plus the last 4 digits. History is generated from `patterns` with a fixed RNG seed.
version: 1
as_of: 2026-10-10          # the sandbox "today"; no wall clock is used when seeding
rng_seed: 20261010
users:
  - id: usr_priya
    display_name: Priya Sharma
    home_region: AU        # region of residence of the customer (Sydney)
    locale: en
    risk_profile: low
    accounts:
      - {id: acc_priya_aud, currency: AUD, balance_minor: 420000}     # AUD 4,200.00
      - {id: acc_priya_npr, currency: NPR, balance_minor: 62000000}   # NPR 620,000.00 (funds from parents)
      - {id: acc_priya_aud_savings, currency: AUD, kind: savings, balance_minor: 150000}   # AUD 1,500.00 savings
    payees:
      - {id: pay_priya_landlord,   name: "Mr. Chen",           region: AU, currency: AUD, provider_ref: null, relation: landlord, added_days_ago: 190}
      - {id: pay_priya_university, name: "Harbourview University",       region: AU, currency: AUD, provider_ref: null, relation: university, added_days_ago: 190}
      - {id: pay_priya_parents,    name: "Baba",                 region: NP, currency: NPR, provider_ref: prov_peakremit_aud_npr, relation: father, added_days_ago: 180}
    patterns:
      - {kind: rent,       payee: pay_priya_landlord,   account: acc_priya_aud, currency: AUD, day: 5,  amount_minor: 180000, jitter_pct: 0, late_months: ["2026-07"]}
      - {kind: tuition,    payee: pay_priya_university, account: acc_priya_aud, currency: AUD, dates: ["2026-07-20"], amount_minor: 650000, jitter_pct: 0, late_months: []}
      - {kind: remittance, payee: pay_priya_parents,    account: acc_priya_aud, currency: AUD, dates: ["2026-08-15"], amount_minor: 20000,  jitter_pct: 0, late_months: [], provider: prov_peakremit_aud_npr}
  - id: usr_ramesh
    display_name: Ramesh Thapa
    home_region: QA        # Doha
    locale: ne
    risk_profile: medium   # frequent scam target
    accounts:
      - {id: acc_ramesh_qar, currency: QAR, balance_minor: 380000}    # QAR 3,800.00
      - {id: acc_ramesh_npr, currency: NPR, balance_minor: 4500000}   # NPR 45,000.00
    payees:
      - {id: pay_ramesh_ama,      name: "Ama",              region: NP, currency: NPR, provider_ref: prov_kathmandulink_qar_npr, relation: mother, added_days_ago: 400}
      - {id: pay_ramesh_suresh,   name: "Suresh",  region: NP, currency: NPR, provider_ref: prov_peakremit_qar_npr, relation: younger_brother, added_days_ago: 300}
      - {id: pay_ramesh_landlord, name: "Al Noor Rooms",  region: QA, currency: QAR, provider_ref: null, relation: landlord, added_days_ago: 400}
      - {id: pay_ramesh_mobile,   name: "DohaMobile",      region: QA, currency: QAR, provider_ref: null, added_days_ago: 400}
    patterns:
      - {kind: remittance, payee: pay_ramesh_ama,      account: acc_ramesh_qar, currency: QAR, day: 28, amount_minor: 90000, jitter_pct: 8, late_months: [], provider: prov_kathmandulink_qar_npr}
      - {kind: remittance, payee: pay_ramesh_suresh,   account: acc_ramesh_qar, currency: QAR, dates: ["2026-06-12", "2026-09-12"], amount_minor: 30000, jitter_pct: 5, late_months: [], provider: prov_peakremit_qar_npr}
      - {kind: rent,       payee: pay_ramesh_landlord, account: acc_ramesh_qar, currency: QAR, day: 1,  amount_minor: 80000, jitter_pct: 0, late_months: ["2026-08"]}
      - {kind: bill,       payee: pay_ramesh_mobile,   account: acc_ramesh_qar, currency: QAR, day: 20, amount_minor: 9900,  jitter_pct: 0, late_months: []}
  - id: usr_anil
    display_name: Anil Gurung
    home_region: CN        # student in China
    locale: zh-CN
    risk_profile: low
    accounts:
      - {id: acc_anil_cny, currency: CNY, balance_minor: 2150000}     # CNY 21,500.00
      - {id: acc_anil_npr, currency: NPR, balance_minor: 30000000}    # NPR 300,000.00
    payees:
      - {id: pay_anil_university, name: "Northridge Institute",   region: CN, currency: CNY, provider_ref: null, relation: university, added_days_ago: 260}
      - {id: pay_anil_landlord,   name: "Ms. Li",       region: CN, currency: CNY, provider_ref: null, relation: landlord, added_days_ago: 260}
      - {id: pay_anil_parents,    name: "Aama ra Baba", region: NP, currency: NPR, provider_ref: prov_swifthome_npr_cny, relation: parents, added_days_ago: 250}
