# Nepali number words. 0-100 compiled from the Wikipedia article "Numbers in Nepali language"
# (https://en.wikipedia.org/wiki/Numbers_in_Nepali_language) and common usage. The irregular forms
# between 11 and 99 are NOT individually verified against a dictionary; several romanised spellings
# are listed per value on purpose, and romanisation_folding.yaml collapses vowel length and doubled
# consonants so more spellings match. Review before relying on rare forms.
version: 1
digits:
