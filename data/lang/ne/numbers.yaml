  1000:      {deva: [हजार, हज़ार], latn: [hajar, hazar, hajaar, hazaar]}
  100000:    {deva: [लाख], latn: [lakh, lac, laakh]}
  10000000:  {deva: [करोड, करोड़], latn: [crore, karod, karor]}
  1000000000: {deva: [अर्ब], latn: [arab]}
# Words that are also very common non-number words. They only count as numbers next to a
# multiplier or a currency word, never alone ("chha" means "is").
ambiguous_alone: [chha, ek, das, छ, एक, दश, दस, nau, no, sat, char, tin, panch, ath]
suffixes: {k: 1000}      # 20k = 20,000
connectors: [ra, ani, र, and, "&"]
